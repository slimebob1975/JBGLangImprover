<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBG klarspråkning</title>
    <link rel="icon" href="/static/favicon/favicon.ico" type="image/x-icon">
    <script src="/static/javascript/script.js" defer></script>  <!-- External JavaScript -->
    <link rel="stylesheet" href="/static/styles/styles.css">  <!-- External CSS -->
</head>
<body>
    <div id="wrapper">
        <h1 name="app-title" id="app-title">JBG klarspråkning</h1>
        <h3><em>För .docx-filer</em></h3>
        <!-- Fylls i av script.js; dold bara om anropet till /me misslyckas -->
        <p id="userDisplay" class="user-display" hidden></p>
        <form id="uploadForm">
            <!-- Panel 1: Ladda upp din text -->
            <fieldset class="settings-panel">
                <legend id="uploadLegend">Ladda upp din text</legend>
                <input type="file" id="documentFile" name="file" accept=".docx" required
                       title="Endast Word-filer (.docx). Originalfilen ändras inte: du får tillbaka en ny fil med förslagen." aria-labelledby="uploadLegend">
            </fieldset>

            <!-- Panel 2: Inställningar för språkmodellen -->
            <fieldset class="settings-panel">
                <legend>Inställningar för språkmodellen</legend>
            <label for="apiKey" title="API-nyckeln är en form av lösenord som du får av lokalsamordnaren">Skriv in din OpenAI API-nyckel:</label>
            <input type="password" id="apiKey" name="apiKey" placeholder="sk-..." required>

            <label for="model" title="Modellen används både för förslagen i texten och för granskningen av dokumentet som helhet. Nyare modeller är bättre men dyrare att använda.">Välj språkmodell för granskningen:</label>
            <select id="model" name="model">
                <option value="gpt-5.6-terra" >gpt-5.6-terra</option>
                <option value="gpt-5.6-luna" >gpt-5.6-luna</option>
                <option value="gpt-5.4-mini" >gpt-5.4-mini</option>
                <option value="gpt-5.2" selected>gpt-5.2</option>
                <option value="gpt-5.1">gpt-5.1</option>
                <option value="gpt-5">gpt-5</option>
                <option value="gpt-5-mini">gpt-5-mini</option>
                <option value="gpt-4o">gpt-4o</option>
            </select>

            <label for="editablePrompt" title="Instruktionen styr förslagen inom enskilda stycken, tabellceller, textrutor, fotnoter, sidhuvuden och sidfötter. Den påverkar inte granskningen av dokumentet som helhet. Ändra standardtexten om du vill ge särskilda instruktioner.">Anpassa den lokala promptinstruktionen:</label>
            <textarea id="editablePrompt" name="editablePrompt" rows="6" placeholder="Laddar policy..." required></textarea>
            </fieldset>

            <!-- Panel 3: Dokumentinställningar (granskning på dokumentnivå) -->
            <fieldset class="settings-panel">
                <legend>Dokumentinställningar</legend>
            <div class="form-check" title="Språkmodellen läser dokumentet som helhet och lägger till kommentarer i Word om onödiga upprepningar, påståenden som säger emot varandra, troliga fel som kvarlämnad arbetstext, slutsatser som behöver stöd i resultaten samt förslag om avsnittens ordning och om rubriker. Texten ändras inte. Tar längre tid och kostar fler tokens.">
                <input type="checkbox" id="globalReview" name="globalReview">
                <label for="globalReview">Granska dokumentets struktur och upplägg</label>
            </div>
            <div class="form-check" title="LIX (läsbarhetsindex) bygger på meningarnas längd och andelen långa ord. Värdet efter granskningen förutsätter att alla förslag godtas. Värdena visas i avsnittet Om klarspråkningen, eller som en kommentar vid dokumentets titel om avsnittet inte läggs till.">
                <input type="checkbox" id="computeLix" name="computeLix">
                <label for="computeLix">Beräkna LIX-värde före och efter språkgranskning</label>
            </div>

            <!-- Temperature Slider (obsolete from GPT-5 models) -->
            <div style="display: none;">
                <label for="temperature" title="Kreativiteten styr hur förutsägbart språkmodellen uppför sig. Låg kreativitet ger hög förutsägbarhet, och tvärtom. (0 = lågt värde, 1 = högt värde)">Välj låg eller hög kreativitet i språkgranskningen:</label>
                <div class="form-inline">
                    <input type="range" id="temperature" name="temperature" min="0" max="1" step="0.01" value="0.7">
                    <span id="tempDisplay">0.7</span>
                </div>
            </div>
            </fieldset>

            <!-- Panel 4: Hur ska resultatet se ut? -->
            <fieldset class="settings-panel">
                <legend>Hur ska resultatet se ut?</legend>
            <!-- DOCX Markup Mode -->
            <div id="doxcModeRadioButtons" role="radiogroup" aria-labelledby="docxModeLabel">
                <label id="docxModeLabel">Visa förslag till förändringarna med:</label>
                <div class="form-check" title="Text som föreslås bli borttagen visas överstruken i rött och ny text i grönt. Förslagen motiveras inte med kommentarer.">
                    <input type="radio" id="simpleMarking" name="docxMode" value="simple" checked>
                    <label for="simpleMarking">Enkel färgmarkering</label>
                </div>
                <div class="form-check" title="Förslagen läggs in som spårade ändringar i Word, med en kommentar som motiverar varje förslag. Du godtar eller avvisar dem ett i taget eller alla på en gång.">
                    <input type="radio" id="trackedChanges" name="docxMode" value="tracked">
                    <label for="trackedChanges">Spåra ändringar och infogade kommentarer</label>
                </div>
            </div>
            </fieldset>

            <!-- Panel 5: Övrigt -->
            <fieldset class="settings-panel">
                <legend>Övrigt</legend>
            <div class="form-check" title="Ett avsnitt sist i dokumentet med uppgifter om granskningen: språkmodell, anrop och tokens, antal förslag och iakttagelser samt läsbarhet (LIX) om den beräknas. Med Spåra ändringar infogas det som en spårad ändring som du kan avvisa i ett steg.">
                <input type="checkbox" id="includeAboutSection" name="includeAboutSection">
                <label for="includeAboutSection">Lägg till ”Om klarspråkningen” sist</label>
            </div>
             <div class="form-inline" style="display: none;">
                <label for="includeMotivations" title="Språkmodellen motiverar förändringsförslagen, och motiveringarna läggs som kommentarer i dokumentet. Gäller bara Spåra ändringar.">Lägg till kommentarer till förslagen ("Spåra ändringar"):</label>
                <input type="checkbox" id="includeMotivations" name="includeMotivations" checked>
            </div>
            </fieldset>

            <!-- The start button!!! -->
            <button id="button" name="button" type="submit" title="Börja din språkgranskning!">Starta</button>
        </form>
        <!-- A spinner that spins while executing -->
        <div id="spinner-container">
            <div class="spinner"></div>
        </div>
        <p id="status"></p>

    </div> <!-- Wrapper -->
     <footer style="margin-top: 16px; font-size: 0.9em; color: #555; text-align: center; line-height: 1.5;">
        AI kan göra misstag. Du är själv ansvarig för att kontrollera resultatet.<br>
        Har du problem med tjänsten? Prova att ladda om den med Ctrl-Shift-R.
    </footer>
</body>
</html>
